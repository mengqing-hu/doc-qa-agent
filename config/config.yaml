chunking:
  chunk_size: 2000          
  chunk_overlap: 200

document_parsing:
  pdf_title_font_size_threshold: 11.0
  pdf_page_number_offset: 10

embedding:
  model_name: "BAAI/bge-large-en-v1.5"

llm:
  provider: "scadsai"
  base_url: "https://llm.scads.ai/v1"
  model: "meta-llama/Llama-3.3-70B-Instruct"
  temperature: 0.0
  max_tokens: 512

generation:
  prompt_path: "prompts/qa_prompt.md"
  max_context_characters: 10000

documents:
  paths:
    - "data/raw/HuMengqing.pdf"
    - "data/raw/Report.docx"


retrieval:
  bm25_top_k: 20
  dense_top_k: 20
  hybrid_top_k: 10
  rerank_top_k: 10
  final_top_k: 5
  rrf_k: 60

reranking:
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  batch_size: 16

vector_store:
  collection_name: "doc_chunks"
  persist_dir: "data/chroma_db"

logging:
  level: "INFO"
  log_dir: "logs"
