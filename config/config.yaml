chunking:
  chunk_size: 1000          
  chunk_overlap: 100
  filters:
    exclude_section_kinds:
      - front_matter
      - toc
      - references
      - appendix
      - header_footer
      - footnote

document_parsing:
  mineru:
    api_base_url: "https://mineru.net"
    token_env_var: "MINERU_API_TOKEN"
    request_timeout_seconds: 30
    upload_timeout_seconds: 300
    task_timeout_seconds: 600
    poll_interval_seconds: 5
    model_version: "vlm"
    is_ocr: false

embedding:
  provider: "local"
  model_name: "BAAI/bge-large-en-v1.5"

llm:
  provider: "scadsai"
  base_url: "https://llm.scads.ai/v1"
  model: "meta-llama/Llama-3.3-70B-Instruct"
  temperature: 0.0
  # Default per-call output budget. The synthesis node overrides this with a
  # larger budget; this value covers chitchat and the JSON-emitting nodes.
  max_tokens: 1024
  max_retries: 2

generation:
  prompt_path: "prompts/qa_prompt.md"
  max_context_characters: 10000

documents:
  paths:
    - "data/raw/HuMengqing.pdf"
    - "data/raw/Report.docx"

agent:
  # Hard cap on retrieval-planning rounds per turn. Round 1 decomposes the
  # question into independent sub-queries (run together); round 2 adds only the
  # dependent follow-ups. Round 3 rarely adds anything and mostly re-searches.
  max_retrieval_rounds: 2
  context:
    # Token budget for the conversation window shown to the LLMs. The full
    # transcript is stored separately (src/store/messages.py) and never trimmed.
    max_context_tokens: 3000
    # Fold older uncovered turns into the rolling summary once this many are
    # eligible; keep the most recent turns verbatim.
    resummarize_after: 12
    keep_recent_verbatim: 6


retrieval:
  bm25_top_k: 40
  dense_top_k: 40
  hybrid_top_k: 30
  final_top_k: 5
  rrf_k: 60

# reranking:
#   model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
#   batch_size: 16

reranking:
  provider: "scadsai"
  model: "Qwen/Qwen3-Reranker-4B"
  base_url: "https://llm.scads.ai/v1"
  endpoint: "rerank"
  timeout_seconds: 30
  min_request_interval_seconds: 1
  max_retries: 5
  batch_size: 10
  instruction: "Given a query, retrieve relevant passages that answer it."

vector_store:
  collection_name: "doc_chunks"
  persist_dir: "data/chroma_db"

evaluation:
  # LLM-as-judge model for evaluation/evaluate_agent.py. Use a stronger model
  # from a different family than llm.model to avoid self-preference bias.
  # Override at runtime with --judge-model.
  judge:
    model: "openai/gpt-oss-120b"
    base_url: "https://llm.scads.ai/v1"   # optional; defaults to llm.base_url

logging:
  level: "INFO"
  log_dir: "logs"
