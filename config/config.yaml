chunking:
  chunk_size: 1000          
  chunk_overlap: 100
  filters:
    exclude_section_kinds:
      - front_matter
      - toc
      - references
      - appendix
      - header_footer
      - footnote

document_parsing:
  mineru:
    api_base_url: "https://mineru.net"
    token_env_var: "MINERU_API_TOKEN"
    request_timeout_seconds: 30
    upload_timeout_seconds: 300
    task_timeout_seconds: 600
    poll_interval_seconds: 5
    model_version: "vlm"
    is_ocr: false

embedding:
  provider: "scadsai"
  model_name: "Qwen/Qwen3-Embedding-4B"
  base_url: "https://llm.scads.ai/v1"

# embedding:
#   model_name: "BAAI/bge-large-en-v1.5"

llm:
  provider: "scadsai"
  base_url: "https://llm.scads.ai/v1"
  model: "meta-llama/Llama-3.3-70B-Instruct"
  temperature: 0.0
  max_tokens: 512

generation:
  prompt_path: "prompts/qa_prompt.md"
  max_context_characters: 10000

documents:
  paths:
    - "data/raw/HuMengqing.pdf"
    - "data/raw/Report.docx"


retrieval:
  bm25_top_k: 40
  dense_top_k: 40
  hybrid_top_k: 30
  final_top_k: 5
  rrf_k: 60

# reranking:
#   model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
#   batch_size: 16

reranking:
  provider: "scadsai"
  model: "Qwen/Qwen3-Reranker-4B"
  base_url: "https://llm.scads.ai/v1"
  endpoint: "rerank"
  timeout_seconds: 30
  min_request_interval_seconds: 1
  max_retries: 5
  batch_size: 10
  instruction: "Given a query, retrieve relevant passages that answer it."

vector_store:
  collection_name: "doc_chunks_qwen3_embed"
  persist_dir: "data/chroma_db"

logging:
  level: "INFO"
  log_dir: "logs"
